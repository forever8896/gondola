# Publishes the landing page (site/) to GitHub Pages at gondola.kilian.solutions.
name: Landing page
on:
  push:
    branches: [main]
    paths: [site/**, docs/media/**, public/logo.png, public/favicon.png, public/apple-touch-icon.png, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/media
          cp -r site/. _site/
          cp docs/media/timelapse.mp4 docs/media/poster.jpg _site/media/
          cp public/logo.png public/favicon.png public/apple-touch-icon.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
